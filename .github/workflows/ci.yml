name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check whr tests benchmarks scripts
          uv run ruff format --check whr tests benchmarks scripts

      - name: Type-check (mypy)
        run: uv run mypy whr benchmarks/provenance.py benchmarks/download_data.py benchmarks/smoke.py scripts/check_distribution.py

      - name: Test (pytest)
        run: uv run pytest

      - name: Benchmark smoke
        run: uv run python benchmarks/smoke.py

      - name: Build documentation
        if: matrix.python-version == '3.13'
        run: |
          uv sync --group docs
          uv run --group docs mkdocs build --strict

      - name: Validate distributions
        if: matrix.python-version == '3.13'
        run: |
          uv build
          python scripts/check_distribution.py dist
