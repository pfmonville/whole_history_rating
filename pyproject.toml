[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whole-history-rating"
version = "3.5.0"
description = "Python implementation of Rémi Coulom's Whole-History Rating (WHR) algorithm."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENCE.txt" }
authors = [
    { name = "Pierre-François Monville", email = "pfmonville@users.noreply.github.com" },
]
keywords = [
    "whr",
    "whole-history-rating",
    "elo",
    "rating",
    "ranking",
    "bayesian",
    "go",
    "chess",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/pfmonville/whole_history_rating"
Repository = "https://github.com/pfmonville/whole_history_rating"
Issues = "https://github.com/pfmonville/whole_history_rating/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["whr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
addopts = "--cov=whr --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# Line length is governed by the formatter; long docstrings/strings are left as-is.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["whr"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
